# US-PLT-13: Order Deployment and Service (SDD 10.2: 2 replicas). Needs
# app-config for CART_SERVICE_URL/INVENTORY_SERVICE_URL (checkout
# orchestration calls both) in addition to its own Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: bookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        netpol: postgres-client # US-PLT-19: see 21-identity.yaml's comment
    spec:
      containers:
        - name: order
          image: 172.16.200.23:5000/bookstore/order:0.1.1-a08a02d
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: order-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /api/orders/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: bookstore
spec:
  selector:
    app: order
  ports:
    - port: 8000
      targetPort: 8000
---
# US-PLT-18: NodePort so the external Prometheus (registry-monitoring VM,
# not a cluster member, no route to ClusterIPs) can scrape /metrics. Same
# bridging mechanism the Ingress already uses at :30080 - stays inside the
# VPN-only subnet, never touches the public Ingress. Note: order has 2
# replicas (SDD 10.2) - a NodePort load-balances across both, so this only
# gives a single-replica view of the app's own counters at any moment. Not a
# problem for AC#1 (proves the target is Up and reporting real data); the
# "Load and outcome" dashboard row is fed by k6's own remote-write output
# instead, not by this endpoint, precisely to avoid that limitation.
apiVersion: v1
kind: Service
metadata:
  name: order-metrics-nodeport
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: order
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30085
