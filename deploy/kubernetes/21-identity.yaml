# US-PLT-13: Identity Deployment and Service (SDD 10.2: 1 replica).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
        # US-PLT-19: selected by 33-network-policies.yaml's Postgres allow
        # rule - orthogonal to `app` since that label is also the Service
        # selector (reusing it on a non-app-port pod would be wrong there).
        netpol: postgres-client
    spec:
      containers:
        - name: identity
          image: 172.16.200.23:5000/bookstore/identity:0.1.1-a08a02d
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: identity-secrets
          readinessProbe:
            httpGet:
              path: /api/auth/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: bookstore
spec:
  selector:
    app: identity
  ports:
    - port: 8000
      targetPort: 8000
---
# US-PLT-18: NodePort so the external Prometheus (registry-monitoring VM,
# not a cluster member, no route to ClusterIPs) can scrape /metrics. Same
# bridging mechanism the Ingress already uses at :30080 - stays inside the
# VPN-only subnet, never touches the public Ingress.
apiVersion: v1
kind: Service
metadata:
  name: identity-metrics-nodeport
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: identity
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
