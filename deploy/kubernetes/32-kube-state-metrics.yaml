# US-PLT-18: kube-state-metrics (SDD 14.1 - "Deployment replicas, pod
# status, restarts and HPA state"). Cluster-wide monitoring tooling, not a
# bookstore app component, so it lives in kube-system alongside
# metrics-server/Calico rather than the bookstore namespace. RBAC below is
# scoped to only the resource types this project's dashboards actually use
# (deployments/replicasets/pods/HPAs/PVCs), not the full upstream RBAC list
# covering resource types nothing here reads.
#
# IMAGE TAG: check the current release at
# https://github.com/kubernetes/kube-state-metrics/releases before applying
# and replace the placeholder below - don't assume the tag written here is
# still current (same reasoning as US-PLT-09's Kubernetes/Calico version
# handling: this agent's knowledge cutoff predates the actual apply date).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: kube-state-metrics
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:CHECK_LATEST_TAG
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: 20m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 150Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
# NodePort so the external Prometheus (registry-monitoring VM, not a
# cluster member) can reach this - same bridging reasoning as the app
# services' *-metrics-nodeport Services.
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-nodeport
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: kube-state-metrics
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
