# US-PLT-19 diagnostic manifest - proves the negative half of AC#2: an
# unauthorized pod, even inside the same `bookstore` namespace (so the
# block is genuinely due to missing the `netpol` label, not just a
# different namespace), cannot reach Postgres or Redis. Not part of the
# application; apply, check, then delete (see US-PLT-19-runbook.md).
apiVersion: v1
kind: Pod
metadata:
  name: netpol-test
  namespace: bookstore
  labels:
    app: netpol-test
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
  restartPolicy: Never
