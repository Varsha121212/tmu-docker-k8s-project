# US-PLT-13: Inventory Deployment and Service (SDD 10.2: 1 replica).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        netpol: postgres-client # US-PLT-19: see 21-identity.yaml's comment
    spec:
      containers:
        - name: inventory
          image: 172.16.200.23:5000/bookstore/inventory:0.1.1-a08a02d
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: inventory-secrets
          readinessProbe:
            httpGet:
              path: /api/inventory/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: bookstore
spec:
  selector:
    app: inventory
  ports:
    - port: 8000
      targetPort: 8000
---
# US-PLT-18: NodePort so the external Prometheus (registry-monitoring VM,
# not a cluster member, no route to ClusterIPs) can scrape /metrics. Same
# bridging mechanism the Ingress already uses at :30080 - stays inside the
# VPN-only subnet, never touches the public Ingress.
apiVersion: v1
kind: Service
metadata:
  name: inventory-metrics-nodeport
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: inventory
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30083
