# US-PLT-13: catalog Deployment and Service (SDD 10.2: 1 replica now - HPA
# with a 1-4 replica range is added by US-PLT-15, not this story).
#
# US-PLT-15: HorizontalPodAutoscaler below targets 65% average CPU
# utilization against the Deployment's `resources.requests.cpu: 100m` (set
# by US-PLT-14) - the HPA has nothing to compute utilization against
# without that request being set. autoscaling/v2 (not v1) is required for
# an explicit `averageUtilization` target type and per-metric behavior;
# scale-down stabilizationWindowSeconds is left at the (unstated-but-
# effective) cluster default of 300s rather than pinned here, so a brief
# load dip doesn't immediately thrash replicas back down.
#
# US-PLT-17: explicit RollingUpdate strategy rather than the implicit
# cluster default. At replicas:1, the default (25% of 1, rounded) already
# computes to the same maxSurge:1/maxUnavailable:0 - pinning it here just
# makes the "no sustained outage" guarantee readable without a reader
# having to redo that rounding math themselves. maxUnavailable:0 guarantees
# the new pod is Ready before the old one is marked for termination, but
# that alone isn't sufficient for zero request loss - see the `preStop`
# hook below, added after a real rollout/rollback run showed a handful of
# `Connection refused` errors (confirmed in the Ingress controller's own
# logs) against a pod that had already stopped accepting connections
# before Kubernetes/nginx finished propagating its removal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: bookstore
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        netpol: postgres-client # US-PLT-19: see 21-identity.yaml's comment
    spec:
      containers:
        - name: catalog
          image: 172.16.200.23:5000/bookstore/catalog:0.2.0-9bfb373
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:
              exec:
                # Delays SIGTERM to the app process, not the pod's actual
                # removal from the Service - the container keeps accepting/
                # draining in-flight connections during this window while
                # the Endpoints removal propagates to kube-proxy/Ingress.
                # 5s comfortably covers the gap observed in practice (the
                # confirmed failures above cleared within ~1-2s of the pod
                # starting to terminate); default terminationGracePeriodSeconds
                # (30s) already covers this sleep with room to spare.
                command: ["sh", "-c", "sleep 5"]
          envFrom:
            - secretRef:
                name: catalog-secrets
          readinessProbe:
            httpGet:
              path: /api/books/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: bookstore
spec:
  selector:
    app: catalog
  ports:
    - port: 8000
      targetPort: 8000
---
# US-PLT-18: NodePort so the external Prometheus (registry-monitoring VM,
# not a cluster member, no route to ClusterIPs) can scrape /metrics. Same
# bridging mechanism the Ingress already uses at :30080 - stays inside the
# VPN-only subnet, never touches the public Ingress. Note: this HPA scales
# catalog 1-4 replicas - a NodePort load-balances across whichever are
# Ready, so this only gives a single-replica view of the app's own counters
# at any moment. Not a problem for AC#1 (proves the target is Up and
# reporting real data); the "Load and outcome" dashboard row is fed by k6's
# own remote-write output instead, not by this endpoint, precisely to avoid
# that limitation during a scale-up.
apiVersion: v1
kind: Service
metadata:
  name: catalog-metrics-nodeport
  namespace: bookstore
spec:
  type: NodePort
  selector:
    app: catalog
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: bookstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
