# Reference copy of vm-baseline-app's /etc/nginx/sites-available/default
# (originally written directly on the VM per
# documents/runbooks/stage-1/US-PLT-20-runbook.md Phase 2 step 8 - never a
# tracked repo file before now). Only addition vs. that original: two
# `sub_filter` lines in `location /`, injecting a small fixed-position
# banner into the served index.html so Stage 1 is visually distinguishable
# from Stage 2 on the page itself (both serve the identical frontend build
# at the identical http://172.16.200.24/, so nothing else tells them apart
# on sight).
#
# This file is a reference/backup only - it is not copied or applied
# automatically by any script. Apply it by hand once, ahead of the demo
# (see documents/runbooks/final-demo-script.md's pre-demo checklist):
#
#   scp deploy/baseline-vm/nginx-stage1-banner.conf student@172.16.200.24:/tmp/
#   ssh student@172.16.200.24
#   sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak
#   sudo cp /tmp/nginx-stage1-banner.conf /etc/nginx/sites-available/default
#   nginx -V 2>&1 | grep -o with-http_sub_module || echo "MISSING sub_module - see note below"
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# If `nginx -V` doesn't show `--with-http_sub_module`, Ubuntu resolved the
# `nginx` metapackage to a build without it (e.g. nginx-light) - install
# nginx-extras or nginx-full instead (both include it), then repeat the
# reload. Not independently confirmed which variant this VM already has;
# check before assuming the banner will render.

server {
    listen 80;
    server_name _;

    root /var/www/bookstore;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;

        sub_filter '</body>' '<div style="position:fixed;top:8px;right:8px;z-index:9999;background:#d97706;color:#fff;padding:6px 14px;border-radius:4px;font:600 13px/1.4 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);">STAGE 1 &mdash; VM MONOLITH</div></body>';
        sub_filter_once on;
    }
}
