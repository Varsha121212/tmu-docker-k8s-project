# Demo-only override for apps/frontend/nginx.conf's baked-in config,
# bind-mounted onto the frontend container by docker-compose.yml (frontend
# service, `volumes:`) - NOT built into apps/frontend/Dockerfile's image.
# Keeps the image identical to what Stage 3 runs unchanged (ADR-007); the
# banner only ever exists on this Compose-hosted copy.
#
# Only addition vs. apps/frontend/nginx.conf: two `sub_filter` lines in
# `location /`, injecting a small fixed-position banner into the served
# index.html so Stage 1 vs Stage 2 is visually obvious on the page itself,
# not just from terminal output. Scoped to `location /` only (not `server`
# level) so it can never touch the /api/* JSON responses - sub_filter's
# default sub_filter_types is text/html anyway, but scoping it here removes
# any doubt.
#
# If this file's content ever needs to diverge further from
# apps/frontend/nginx.conf, re-sync the two by hand - there is no build
# step linking them.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/auth {
        set $identity_upstream identity:8000;
        proxy_pass http://$identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/books {
        set $catalog_upstream catalog:8000;
        proxy_pass http://$catalog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/inventory {
        set $inventory_upstream inventory:8000;
        proxy_pass http://$inventory_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cart {
        set $cart_upstream cart:8000;
        proxy_pass http://$cart_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders {
        set $order_upstream order:8000;
        proxy_pass http://$order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;

        sub_filter '</body>' '<div style="position:fixed;top:8px;right:8px;z-index:9999;background:#2563eb;color:#fff;padding:6px 14px;border-radius:4px;font:600 13px/1.4 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);">STAGE 2 &mdash; DOCKER COMPOSE</div></body>';
        sub_filter_once on;
    }
}
