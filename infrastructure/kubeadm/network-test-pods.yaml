# US-PLT-10 diagnostic manifest — Calico cross-node networking + CoreDNS
# Service-name resolution validation. Not part of the application; apply,
# check, then delete (see documents/runbooks/stage-3/US-PLT-10-runbook.md).
apiVersion: v1
kind: Pod
metadata:
  name: net-test-1
  labels:
    app: net-test
spec:
  nodeName: vm-worker-1
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: net-test-2
  labels:
    app: net-test
spec:
  nodeName: vm-worker-2
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
  restartPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-test-backend
  template:
    metadata:
      labels:
        app: dns-test-backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dns-test-svc
spec:
  selector:
    app: dns-test-backend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
