# US-PLT-11 placeholder — proves the Ingress path mechanism (external HTTP
# over the VPN -> ingress-nginx -> Service -> pod) before the real frontend
# exists. Not part of the application; apply, check, then delete (see
# infrastructure/kubeadm/US-PLT-11-runbook.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-test-backend
  template:
    metadata:
      labels:
        app: ingress-test-backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-test-svc
spec:
  selector:
    app: ingress-test-backend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-test
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ingress-test
            pathType: Prefix
            backend:
              service:
                name: ingress-test-svc
                port:
                  number: 80
