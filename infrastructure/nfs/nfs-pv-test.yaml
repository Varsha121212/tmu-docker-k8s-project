# US-PLT-12 diagnostic manifest — proves the NFS-backed PV/PVC mechanism
# (mount, write/read, and data survival across pod reschedule) before the
# real PostgreSQL/Redis PVCs exist. Not part of the application; apply,
# check, then delete (see documents/runbooks/stage-3/US-PLT-12-runbook.md).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-test
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 172.16.200.23
    path: /srv/nfs/k8s/pv-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: nfs-pv-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-test-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-test-writer
  template:
    metadata:
      labels:
        app: nfs-test-writer
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: nfs-data
              mountPath: /data
      volumes:
        - name: nfs-data
          persistentVolumeClaim:
            claimName: nfs-pvc-test
