# SDD 11.1 (External Routing): the frontend is the single external entrypoint,
# proxying each /api/* path prefix to its owning backend service by Compose's
# bare service-name DNS (SDD 11.2). All other paths serve the built React SPA,
# falling back to index.html for client-side routing.
#
# In Kubernetes (US-PLT-13), the Ingress intercepts every /api/* path before
# it reaches this pod at all - identity/catalog/inventory/cart/order (bare
# Compose names) don't exist in that cluster's DNS, only the *-service
# Services do, and these location blocks are never actually exercised there.
# BUT nginx resolves a literal `proxy_pass http://host:port` hostname once,
# at config-load time, regardless of whether the location ever receives a
# request - an unresolvable name here means nginx refuses to start at all
# ("host not found in upstream"), not just 502s on that one path. Found for
# real: the frontend Deployment crash-looped in Kubernetes with exactly that
# error (tasks/lessons.md). Fix: use a variable in proxy_pass (with an
# explicit resolver) instead of a literal hostname - this defers resolution
# to request time, so config loads fine in Kubernetes even though these
# names are never resolvable there, while Compose (where they ARE resolvable
# and these blocks DO serve real traffic) behaves identically to before.
# 127.0.0.11 is Docker's fixed embedded DNS resolver on any user-defined
# bridge network (the network Compose's docker-compose.yml already uses) -
# a stable constant, not an assumption specific to this project's setup.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/auth {
        set $identity_upstream identity:8000;
        proxy_pass http://$identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/books {
        set $catalog_upstream catalog:8000;
        proxy_pass http://$catalog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/inventory {
        set $inventory_upstream inventory:8000;
        proxy_pass http://$inventory_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cart {
        set $cart_upstream cart:8000;
        proxy_pass http://$cart_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders {
        set $order_upstream order:8000;
        proxy_pass http://$order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
